name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test MahjongAgent.slnx --configuration Release
      - name: Publish
        run: >-
          dotnet publish src/MahjongAgent.Platform.Windows/MahjongAgent.Platform.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishProfile=win-x64
          -o artifacts/MahjongAgent-${{ github.ref_name }}-win-x64
      - name: Package
        shell: pwsh
        run: |
          $source = "artifacts/MahjongAgent-${{ github.ref_name }}-win-x64"
          $files = @(
            "$source/MahjongAgent.Platform.Windows.exe",
            "$source/README.md",
            "$source/LICENSE.txt"
          )
          Compress-Archive -LiteralPath $files -DestinationPath "artifacts/MahjongAgent-${{ github.ref_name }}-win-x64.zip"
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            "${{ github.ref_name }}",
            "artifacts/MahjongAgent-${{ github.ref_name }}-win-x64.zip",
            "--verify-tag",
            "--generate-notes",
            "--title", "MahjongAgent ${{ github.ref_name }}"
          )
          if ("${{ github.ref_name }}" -match "-") {
            $arguments += "--prerelease"
          }
          gh release create @arguments
