name: Feature request
description: 提议新能力或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景和当前阻碍。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - Windows UI / 悬浮助手
        - 截图与视觉识别
        - 武汉麻将规则
        - 策略与风险
        - Agent 与记忆
        - Provider 与存储
        - 文档与工程
    validations:
      required: true
